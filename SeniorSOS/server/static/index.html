<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content="#0f766e"><link rel=manifest href=/manifest.json><link rel=icon href=/icon.svg><title>CareLink</title>
<style>
:root{--p:#0f766e;--p2:#14b8a6;--bg:#f3f6fb;--c:#fff;--t:#0f172a;--m:#64748b;--r:#dc2626;--o:#f59e0b;--g:#16a34a;--b:#e2e8f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:84px}
header{background:linear-gradient(135deg,var(--p),#115e59);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:20px}header small{opacity:.85}.top{display:flex;justify-content:space-between;align-items:center}
main{padding:14px;max-width:560px;margin:-12px auto 0}.card{background:var(--c);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0f172a14}
h2{font-size:17px;margin:0 0 10px}h3{margin:0 0 6px;font-size:15px}.m{color:var(--m);font-size:13px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
input,select,textarea{width:100%;padding:13px;border:1.5px solid var(--b);border-radius:12px;font:inherit;margin:4px 0 8px;background:#fff}input:focus,select:focus{outline:none;border-color:var(--p2)}
label{font-size:13px;color:var(--m);font-weight:600}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;font:600 16px system-ui;background:var(--p);color:#fff;margin:6px 0}.btn.s{background:#e6f4f1;color:var(--p)}.btn.r{background:var(--r)}.btn.o{background:var(--o)}.btn.g{background:var(--g)}.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid var(--b);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--m);font:600 11px system-ui;padding:6px 0;position:relative}nav button i{display:block;font-style:normal;font-size:22px}nav button.on{color:var(--p)}
.dot{position:absolute;top:0;right:22%;background:var(--r);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}.Good,.ok{background:#dcfce7;color:#166534}.Moderate,.warn{background:#fef3c7;color:#92400e}.Low,.bad{background:#fee2e2;color:#991b1b}
.ring{position:relative;width:110px;height:110px}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.sos1{border-left:6px solid var(--o)}.sos2{border-left:6px solid var(--r);background:#fff5f5}
.steps{display:flex;gap:4px;margin:10px 0}.steps span{flex:1;height:6px;border-radius:3px;background:var(--b)}.steps .d{background:var(--p2)}
.code{font:700 34px ui-monospace,monospace;letter-spacing:6px;text-align:center;background:#f0fdfa;border:2px dashed var(--p2);border-radius:14px;padding:12px;margin:8px 0}
.sw{display:flex;border-radius:14px;overflow:hidden;border:1.5px solid var(--b);margin:6px 0}.sw button{flex:1;padding:13px;border:0;background:#fff;font:600 15px system-ui}.sw .on{background:var(--p);color:#fff}
.key{padding:18px;font-size:24px!important}.li{padding:10px 0;border-bottom:1px solid var(--b)}.li:last-child{border:0}
#toast{position:fixed;top:14px;left:14px;right:14px;background:#0f172a;color:#fff;padding:14px;border-radius:14px;z-index:9;display:none;box-shadow:0 6px 20px #0006}
.auth{max-width:420px;margin:0 auto;padding:30px 18px}.logo{width:76px;height:76px;margin:0 auto 10px;display:block}
</style>
<div id=toast></div><div id=app></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let T=localStorage.t,U=JSON.parse(localStorage.u||'null'),tab,S=null,ST={},seen=0,unread=0,mode='login',role='caregiver';
async function api(p,m='GET',b){const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json',...(T?{Authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status==401&&T)return out();if(!r.ok)throw new Error(j.error||'Error '+r.status);return j}
const toast=(m,ms=3500)=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',ms)};
const act=async(f,ok)=>{try{await f();ok&&toast(ok);await go(tab)}catch(x){toast('⚠ '+x.message)}};
const out=()=>{localStorage.clear();T=U=null;auth()};
const v=id=>$('#'+id)?.value?.trim();
function geo(la,lo){if(window.Android){const v=Android.getLocation();if(v){const q=v.split(',');$('#'+la).value=(+q[0]).toFixed(6);$('#'+lo).value=(+q[1]).toFixed(6);return toast('Location captured')}return toast('No GPS fix yet - wait a few seconds and try again')}if(!navigator.geolocation)return toast('GPS unavailable');navigator.geolocation.getCurrentPosition(p=>{$('#'+la).value=p.coords.latitude.toFixed(6);$('#'+lo).value=p.coords.longitude.toFixed(6);toast('Location captured')},()=>toast('Location blocked (needs HTTPS) - type lat/lon manually'),{enableHighAccuracy:true,timeout:8000})}
/* ---------- auth ---------- */
function auth(){$('#app').innerHTML=`<div class=auth><img class=logo src=/icon.svg><h1 style="text-align:center;margin:0">CareLink</h1><p class=m style="text-align:center">Senior medication, caregiver support &amp; two-stage SOS</p><div class=card>
<div class=sw><button class="${mode=='login'?'on':''}" onclick="mode='login';auth()">Login</button><button class="${mode!='login'?'on':''}" onclick="mode='reg';auth()">Register</button></div>
${mode=='login'?'':`<label>Full name</label><input id=an autocomplete=name><label>I am a</label><div class=sw><button class="${role=='caregiver'?'on':''}" onclick="role='caregiver';auth()">👪 Caregiver</button><button class="${role=='caretaker'?'on':''}" onclick="role='caretaker';auth()">🤝 Nearby Caretaker</button></div>`}
<label>Mobile number</label><input id=ap type=tel inputmode=numeric><label>Password</label><input id=aw type=password><button class=btn onclick=doAuth()>${mode=='login'?'Login':'Create account'}</button></div>${window.Android?'<p style="text-align:center"><a href=# onclick="Android.changeServer();return false">Server settings</a></p>':''}</div>`}
async function doAuth(){try{const b={phone:v('ap'),password:$('#aw').value};if(mode!='login'){b.name=v('an');b.role=role}const r=await api(mode=='login'?'/api/login':'/api/register','POST',b);T=r.token;localStorage.t=T;U={id:r.id,role:r.role,name:b.name||''};localStorage.u=JSON.stringify(U);boot()}catch(x){toast('⚠ '+x.message)}}
/* ---------- shell ---------- */
const TABS={caregiver:[['home','🏠','Home'],['meds','💊','Medicines'],['care','📋','Care'],['alerts','🔔','Alerts'],['demo','📞','Demo']],caretaker:[['req','🚨','Requests'],['prof','👤','Profile'],['alerts','🔔','Alerts']]};
async function boot(){if(!T)return auth();try{U=await api('/api/me');}catch(x){return}
 if(U.role=='caregiver'){const l=await api('/api/seniors');S=l[0]||null}
 $('#app').innerHTML=`<header><div class=top><div><h1 id=ttl></h1><small>${e(U.name)} · ${U.role=='caregiver'?'Caregiver':'Registered Caretaker'}</small></div><button class="btn sm s" onclick=out()>Logout</button></div></header><main id=view></main><nav id=nav></nav>`;go(TABS[U.role][0][0]);poll()}
async function go(t){tab=t;$('#nav').innerHTML=TABS[U.role].map(([k,i,n])=>`<button class="${k==t?'on':''}" onclick="go('${k}')"><i>${i}</i>${n}${k=='alerts'&&unread?`<span class=dot>${unread}</span>`:''}</button>`).join('');
 $('#ttl').textContent=TABS[U.role].find(x=>x[0]==t)[2];try{$('#view').innerHTML=await V[t]()}catch(x){$('#view').innerHTML=`<div class=card>⚠ ${e(x.message)}</div>`}}
async function poll(){if(!T)return;try{const n=await api('/api/notifications');const mx=n[0]?.id||0;if(seen&&mx>seen){const f=n.filter(x=>x.id>seen);toast('🔔 '+f[0].title,5000);window.Android&&Android.notify(f[0].title);navigator.vibrate?.([200,100,200]);unread+=f.length;if(!document.activeElement?.matches('input,select,textarea'))go(tab)}seen=mx}catch(x){}setTimeout(poll,5000)}
/* ---------- caregiver ---------- */
const ring=(s,l)=>{const c=s==null?'#cbd5e1':s>=80?'#16a34a':s>=55?'#f59e0b':'#dc2626';return`<div class=ring><svg viewBox="0 0 100 100"><circle cx=50 cy=50 r=42 fill=none stroke="#e2e8f0" stroke-width=10 /><circle cx=50 cy=50 r=42 fill=none stroke="${c}" stroke-width=10 stroke-linecap=round stroke-dasharray="${(s||0)*2.64} 264" transform="rotate(-90 50 50)"/></svg><b>${s==null?'–':Math.round(s)}</b></div>`};
const V={
async home(){if(!S)return`<div class=card><h2>👵 Register your senior</h2><p class=m>The address you save here becomes the Emergency Response Address used for caretaker search and ambulance dispatch. The senior only needs a basic button phone.</p>
<label>Senior name</label><input id=sn><label>Senior phone (button phone)</label><input id=sp type=tel><label>Voice language</label><select id=sl><option value=ta>தமிழ் Tamil<option value=en>English</select>
<label>Full address</label><input id=sa><div class=grid><div><label>Landmark</label><input id=sk></div><div><label>Pincode</label><input id=sz></div><div><label>City</label><input id=sc></div><div><label>State</label><input id=ss></div></div>
<div class=grid><div><label>Latitude</label><input id=sla inputmode=decimal></div><div><label>Longitude</label><input id=slo inputmode=decimal></div></div><button class="btn s" onclick="geo('sla','slo')">📍 Use my current location (stand at senior's home)</button>
<label>Emergency contact</label><input id=se><button class=btn onclick=addSenior()>Save senior &amp; emergency address</button></div>`;
 const [sc,sos,fu]=await Promise.all([api(`/api/seniors/${S.id}/score`),api(`/api/seniors/${S.id}/sos`),api(`/api/seniors/${S.id}/followup-recommendation`)]);const a=sos.filter(x=>x.status!='CLOSED').pop();
 return`${a?sosCard(a):''}<div class=card><div class=row><div><h2>${e(S.name)}</h2><div class=m>📞 ${e(S.phone)}<br>📍 ${e(S.address)}, ${e(S.city)}</div></div>${ring(sc.weekly)}</div>
<div class=grid3 style="margin-top:10px"><div><div class=m>Today</div><b>${sc.daily??'–'}</b></div><div><div class=m>Month</div><b>${sc.monthly??'–'}</b></div><div><div class=m>Trend</div><b>${sc.trend==null?'–':(sc.trend>0?'▲':'▼')+Math.abs(sc.trend)}</b></div></div>
<p>${sc.label?`<span class="pill ${sc.label}">${sc.label} adherence (7 days)</span>`:'<span class=m>No dose data yet</span>'}</p>${fu.recommend_earlier_followup?`<p class="pill warn">Suggest earlier follow-up (configurable rule)</p>`:''}
<div style="display:flex;gap:4px;align-items:flex-end;height:50px">${sc.series.map(x=>`<div style="flex:1;height:${x==null?4:Math.max(6,x/2)}px;background:${x==null?'#e2e8f0':x>=80?'#16a34a':x>=55?'#f59e0b':'#dc2626'};border-radius:4px"></div>`).join('')}</div></div>
<div class=card><h2>Emergency</h2><button class="btn o" onclick="if(confirm('Start Stage-1 local SOS? Nearby caretakers will be requested.'))act(()=>api('/api/seniors/${S.id}/sos','POST'),'Stage-1 SOS started')">🆘 Start Stage-1 SOS (check on senior)</button><button class="btn r" onclick="if(confirm('Call ambulance now with the saved address?'))act(()=>api('/api/seniors/${S.id}/emergency','POST'),'Ambulance requested')">🚑 Real Emergency – Stage-2 Ambulance</button></div>`},
async meds(){if(!S)return noS();const m=await api(`/api/seniors/${S.id}/medications`);return`<div class=card><h2>Medicine schedule</h2>${m.map(x=>`<div class=li><b>💊 ${e(x.name)}</b> ${e(x.dosage)}<div class=m>⏰ ${e(x.times)} · from ${x.start}${x.end?' to '+x.end:''}<br>${e(x.instructions)}</div></div>`).join('')||'<p class=m>No medicines yet</p>'}</div>
<div class=card><h2>Add medicine</h2><label>Name</label><input id=mn><label>Dosage</label><input id=md placeholder="500 mg"><label>Times (24h, comma separated)</label><input id=mt placeholder="08:00,14:00,20:00"><label>End date (optional)</label><input id=me type=date><label>Instructions</label><input id=mi placeholder="After food">
<button class=btn onclick=addMed()>Save &amp; schedule calls</button></div>`},
async care(){if(!S)return noS();const [a,se,m]=await Promise.all([api(`/api/seniors/${S.id}/appointments`),api(`/api/seniors/${S.id}/side-effects`),api(`/api/seniors/${S.id}/medications`)]);
 return`<div class=card><h2>📅 Appointments</h2>${a.map(x=>`<div class=li><b>${e(x.doctor)}</b> · ${e(x.hospital)}<div class=m>${x.when.replace('T',' ').slice(0,16)} · ${e(x.reason)}${x.followup?' · follow-up '+x.followup:''}</div></div>`).join('')||'<p class=m>None</p>'}
<label>Doctor</label><input id=ad><label>Hospital</label><input id=ah><label>Date &amp; time</label><input id=aw2 type=datetime-local><label>Reason</label><input id=ar><label>Follow-up date</label><input id=af type=date><button class=btn onclick=addAppt()>Add appointment</button></div>
<div class=card><h2>🩺 Side effects</h2>${se.map(x=>`<div class=li><b>${e(x.kind)}</b> <span class="pill ${x.severity=='Severe'?'bad':x.severity=='Moderate'?'warn':'ok'}">${e(x.severity)}</span><div class=m>${e(x.medicine)} · ${e(x.description)}</div></div>`).join('')||'<p class=m>None logged</p>'}
<label>Medicine</label><select id=sem>${m.map(x=>`<option>${e(x.name)}`).join('')}</select><label>Type</label><select id=sek><option>Dizziness<option>Nausea<option>Headache<option>Weakness<option>Sleepiness<option>Other</select><label>Severity</label><select id=ses><option>Mild<option>Moderate<option>Severe</select><label>Description</label><input id=sed>
<button class="btn o" onclick=addSE()>Log side effect (caregiver review alert)</button><p class=m>The app never diagnoses; it only alerts you to review.</p></div>`},
async alerts(){unread=0;const n=await api('/api/notifications');$('#nav').querySelectorAll('.dot').forEach(d=>d.remove());return`<div class=card><h2>Notifications</h2>${n.map(x=>`<div class=li>${e(x.title)}<div class=m>${x.created.replace('T',' ').slice(5,16)} UTC</div></div>`).join('')||'<p class=m>Nothing yet</p>'}</div>`},
async demo(){if(!S)return noS();const m=await api(`/api/seniors/${S.id}/medications`);return`<div class=card><h2>📞 Button-phone simulator</h2><p class=m>Real calls need a telephony provider (Twilio/Exotel). Use this to test the whole flow on one phone.</p><label>Medicine</label><select id=dm>${m.map(x=>`<option value=${x.id}>${e(x.name)}`).join('')}</select>
<button class=btn onclick=trig()>⏰ Medication time → place IVR call</button><div class=card style="background:#0f172a;color:#fff;text-align:center"><div class=m style="color:#94a3b8">Senior's phone ${ST.call?'· call #'+ST.call:''}</div><p>“Good morning. Time to take your medicine…”<br>Press 1 Taken · 2 Later · 3 Missed</p><div class=grid3>${[1,2,3].map(d=>`<button class="btn s key" onclick=dtmf(${d})>${d}</button>`).join('')}</div></div>
<h3>Simulate call failures (3 failed attempts → Stage-1 SOS)</h3><div class=grid><button class="btn s" onclick="cst('busy')">Busy</button><button class="btn s" onclick="cst('switched-off')">Switched off</button><button class="btn s" onclick="cst('out-of-coverage')">No coverage</button><button class="btn s" onclick="cst('no-answer')">No answer</button></div>
<h3>Timeouts</h3><button class="btn s" onclick="act(async()=>{await api('/api/dev/age/200','POST');await api('/api/dev/tick','POST')},'Caretaker no-response simulated')">Caretaker did not respond → next</button></div>`}};
const noS=()=>`<div class=card>Register a senior on the Home tab first.</div>`;
function sosCard(a){const st=a.stage,ac=a.requests.find(r=>r.status=='ACCEPTED'),am=a.ambulance[0],du=a.door.find(d=>d.ok);const steps=[1,!!a.requests.length,!!ac,!!du,a.outcome!='',st==2];
return`<div class="card ${st==2?'sos2':'sos1'}"><div class=row><h2>${st==2?'🚑 STAGE-2 · Emergency':'🆘 STAGE-1 · Local response'}</h2><span class="pill ${st==2?'bad':'warn'}">${a.status}</span></div><div class=steps>${steps.map(x=>`<span class="${x?'d':''}"></span>`).join('')}</div>
<div class=m>Trigger: ${e(a.reason)}</div>${a.requests.map(r=>`<div class=li>Caretaker #${r.caretaker_id} · rank ${r.rank} · ${r.dist} km · ETA ${Math.round(r.eta)} min · ₹${r.cost} <span class="pill ${r.status=='ACCEPTED'?'ok':r.status=='PENDING'?'warn':'bad'}">${r.status}</span></div>`).join('')}
${du?'<div class=li>🔓 Door unlocked with one-time authorization</div>':''}${a.outcome?`<div class=li>Caretaker result: <b>${{A:'Senior safe',B:'Needs caregiver attention',C:'Medical emergency'}[a.outcome]}</b></div>`:''}${am?`<div class=li>🚑 Ambulance <b>${am.status}</b><br><span class=m>${e(am.address)}</span></div>`:''}</div>`}
async function addSenior(){await act(async()=>{S=await api('/api/seniors','POST',{name:v('sn'),phone:v('sp'),lang:v('sl'),address:v('sa'),landmark:v('sk'),pincode:v('sz'),city:v('sc'),state:v('ss'),lat:parseFloat(v('sla')),lon:parseFloat(v('slo')),emergency_contact:v('se')})},'Senior saved')}
const addMed=()=>act(()=>api(`/api/seniors/${S.id}/medications`,'POST',{name:v('mn'),dosage:v('md'),times:v('mt'),end:v('me')||null,instructions:v('mi')}),'Medicine scheduled');
const addAppt=()=>act(()=>api(`/api/seniors/${S.id}/appointments`,'POST',{doctor:v('ad'),hospital:v('ah'),when:v('aw2'),reason:v('ar'),followup:v('af')||null}),'Appointment added');
const addSE=()=>act(()=>api(`/api/seniors/${S.id}/side-effects`,'POST',{medicine:v('sem'),kind:v('sek'),severity:v('ses'),description:v('sed')}),'Alert sent to caregiver');
async function trig(){const r=await api('/api/dev/trigger/'+v('dm'),'POST',{});ST.call=r.call_id;toast('Calling senior… use keypad');go('demo')}
const dtmf=d=>act(async()=>{const r=await api('/ivr/dtmf','POST',{call_id:ST.call,digit:String(d)});toast('Response: '+r.result)});
const cst=s=>act(async()=>{const r=await api('/ivr/status','POST',{call_id:ST.call,status:s});if(r.next_call_id)ST.call=r.next_call_id;toast(r.result=='retry'?'Retrying call…':r.result=='unreachable'?'Senior unreachable → Stage-1 SOS':r.result)});
/* ---------- caretaker ---------- */
let P={};
V.prof=async()=>{P=await api('/api/caretaker/profile');return`<div class=card><h2>Availability</h2><div class=sw>${['AVAILABLE','UNAVAILABLE'].map(s=>`<button class="${P.status==s||(P.status=='BUSY'&&s=='UNAVAILABLE')?'on':''}" onclick="saveP({status:'${s}'})">${s=='AVAILABLE'?'🟢 Available':'⚪ Unavailable'}</button>`).join('')}</div>${P.status=='BUSY'?'<p class="pill warn">Currently busy on an SOS</p>':''}
<label>My service / call cost (₹)</label><input id=pc type=number value="${P.cost??''}"><div class=grid><div><label>Latitude</label><input id=pla value="${P.lat??''}"></div><div><label>Longitude</label><input id=plo value="${P.lon??''}"></div></div>
<button class="btn s" onclick="geo('pla','plo')">📍 Use my current location</button><label style="display:flex;gap:10px;align-items:center"><input type=checkbox id=pcn style="width:24px" ${P.consent?'checked':''}> I consent to receive SOS requests</label>
<button class=btn onclick="saveP({cost:+v('pc'),lat:+v('pla'),lon:+v('plo'),consent:$('#pcn').checked})">Save profile</button><p class=m>Only available + consented caretakers are ever contacted. Senior details are revealed only after you accept.</p></div>`};
const saveP=b=>act(()=>api('/api/caretaker/profile','POST',b),'Saved');
V.req=async()=>{P=await api('/api/caretaker/profile');const r=await api('/api/caretaker/requests');const setup=!P.id||P.lat==null;
 return`${setup?'<div class="card sos1"><b>Complete your profile first</b><br><span class=m>Add location, cost and consent in the Profile tab.</span></div>':''}<div class=card><div class=row><div><h2>My status</h2><span class="pill ${P.status=='AVAILABLE'?'ok':P.status=='BUSY'?'warn':'bad'}">${P.status||'—'}</span></div><button class="btn sm s" onclick="saveP({status:'${P.status=='AVAILABLE'?'UNAVAILABLE':'AVAILABLE'}'})">${P.status=='AVAILABLE'?'Go offline':'Go available'}</button></div></div>
${r.map(x=>x.status=='PENDING'?`<div class="card sos1"><h2>🆘 Senior assistance request</h2><div class=grid3><div><div class=m>Distance</div><b>${x.dist} km</b></div><div><div class=m>ETA</div><b>${Math.round(x.eta)} min</b></div><div><div class=m>Est. cost</div><b>₹${x.cost}</b></div></div><p class=m>Approx. area: ${x.approx_lat}, ${x.approx_lon}<br>Full address is shown after you accept.</p>
<div class=grid><button class="btn g" onclick="resp(${x.id},true)">✔ Accept</button><button class="btn r" onclick="resp(${x.id},false)">✖ Reject</button></div></div>`:
`<div class="card sos1"><h2>✅ Accepted · ${e(x.senior_name)}</h2><p>📍 ${e(x.address)}<br><span class=m>${e(x.landmark)}</span></p><div class=grid><a class="btn s" style="text-align:center;text-decoration:none" target=_blank href="https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lon}">🧭 Navigate</a><a class="btn s" style="text-align:center;text-decoration:none" href="tel:${e(x.caregiver_phone)}">📞 Call caregiver</a></div>
<h3>🔐 Smart-door access</h3>${ST['c'+x.id]?`<div class=code>${ST['c'+x.id]}</div><p class=m>One-time code, valid 10 min. Tap to send as secure DTMF to the door.</p>`:''}<input id=dc placeholder="Enter one-time code" inputmode=numeric value="${ST['c'+x.id]||''}"><button class=btn onclick=unlock()>🔓 Send DTMF &amp; unlock door</button>
<button class="btn s" onclick="act(()=>api('/api/sos/${x.sos_id}/arrive','POST'),'Arrival confirmed')">📍 I have arrived</button><h3>Senior check result</h3><button class="btn g" onclick="rs(${x.sos_id},'A')">A · Senior safe</button><button class="btn o" onclick="rs(${x.sos_id},'B')">B · Needs caregiver attention</button><button class="btn r" onclick="if(confirm('Escalate to ambulance?'))rs(${x.sos_id},'C')">C · MEDICAL EMERGENCY</button></div>`).join('')||'<div class=card><p class=m style="text-align:center">No active requests.<br>Stay available to receive SOS alerts.</p></div>'}`};
const resp=(id,a)=>act(async()=>{const r=await api(`/api/caretaker/requests/${id}/respond`,'POST',{accept:a});if(a)ST['c'+id]=r.door_code},a?'Accepted – address revealed':'Rejected');
const unlock=()=>act(()=>api('/api/door/unlock','POST',{digits:v('dc')}),'🔓 Door unlocked – caregiver notified');
const rs=(i,o)=>act(()=>api(`/api/sos/${i}/result`,'POST',{outcome:o}),'Result sent');
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
boot();
</script>
